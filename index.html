<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>写真を人物ごとに仕分け</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.js"></script>
  </head>
  <body>
    <main>
      <h1>写真を人物ごとに仕分け</h1>
      <p>写真を送って「人物ごとに仕分け」を押してください。</p>

      <label>
        写真を送る
        <input id="image-files" type="file" accept="image/*" multiple />
      </label>
      <button id="camera-start" type="button">カメラを開く</button>
      <div>
        <button id="camera-capture" type="button" disabled>撮影して追加</button>
        <button id="camera-stop" type="button" disabled>カメラを閉じる</button>
        <video id="camera" autoplay muted playsinline hidden style="max-width: 100%; height: auto"></video>
      </div>

      <p>送信済み: <span id="photo-count">0</span>枚</p>
      <button id="sort" type="button" disabled>人物ごとに仕分け</button>
      <button id="clear" type="button" disabled>クリア</button>
      <details>
        <summary>詳細設定</summary>
        <label>
          類似度
          <input id="similarity-threshold" type="number" min="0" max="1" step="0.05" value="0.5" />
        </label>
      </details>

      <p id="status" role="status" aria-live="polite">写真を送ってください。</p>
      <h2>仕分け結果</h2>
      <div id="groups"></div>
      <div id="unmatched-container" hidden>
        <h2>顔を検出できなかった写真</h2>
        <ul id="unmatched"></ul>
      </div>
      <p>写真は端末内で処理します。人物番号は名前ではありません。</p>
      <p>顔認識ライブラリ: <a href="https://github.com/vladmandic/human">Human</a>（<a href="https://github.com/vladmandic/human/blob/main/LICENSE">MIT License</a>）</p>
    </main>

    <script type="module">
      const MODEL_BASE_PATH = "https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/models/";
      const MAX_IMAGE_SIDE = 1280;
      const MAX_PREVIEW_SIDE = 480;
      const fileInput = document.querySelector("#image-files");
      const cameraVideo = document.querySelector("#camera");
      const cameraStartButton = document.querySelector("#camera-start");
      const cameraCaptureButton = document.querySelector("#camera-capture");
      const cameraStopButton = document.querySelector("#camera-stop");
      const thresholdInput = document.querySelector("#similarity-threshold");
      const sortButton = document.querySelector("#sort");
      const clearButton = document.querySelector("#clear");
      const status = document.querySelector("#status");
      const photoCount = document.querySelector("#photo-count");
      const groupsElement = document.querySelector("#groups");
      const unmatchedContainer = document.querySelector("#unmatched-container");
      const unmatchedList = document.querySelector("#unmatched");

      const photos = [];
      const objectUrls = new Set();
      let nextPhotoId = 1;
      let human = null;
      let cameraStream = null;
      let busy = false;

      async function requireWebGPU() {
        if (!navigator.gpu) {
          throw new Error("このブラウザーではWebGPUを利用できません。");
        }
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          throw new Error("WebGPU adapterを取得できませんでした。");
        }
      }

      function updateControls() {
        const cameraActive = Boolean(cameraStream);
        fileInput.disabled = busy;
        thresholdInput.disabled = busy;
        sortButton.disabled = busy || photos.length === 0;
        clearButton.disabled = busy || photos.length === 0;
        cameraStartButton.disabled = busy || cameraActive;
        cameraCaptureButton.disabled = busy || !cameraActive;
        cameraStopButton.disabled = busy || !cameraActive;
      }

      function stopCamera() {
        if (cameraStream) {
          for (const track of cameraStream.getTracks()) track.stop();
          cameraStream = null;
        }
        cameraVideo.srcObject = null;
        cameraVideo.hidden = true;
        updateControls();
      }

      async function canvasToBlob(canvas) {
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(
            (value) => value ? resolve(value) : reject(new Error("画像を保存できませんでした。")),
            "image/jpeg",
            0.9,
          );
        });
        return blob;
      }

      async function createPhoto(file, name = file.name) {
        const bitmap = await createImageBitmap(file);
        let canvas;
        try {
          const scale = Math.min(
            1,
            MAX_IMAGE_SIDE / Math.max(bitmap.width, bitmap.height),
          );
          canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          const context = canvas.getContext("2d");
          if (!context) throw new Error("画像を処理するCanvasを作成できません。");
          context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          const blob = await canvasToBlob(canvas);
          const previewUrl = URL.createObjectURL(blob);
          objectUrls.add(previewUrl);
          return {
            id: nextPhotoId++,
            name,
            blob,
            previewUrl,
            faces: null,
            error: null,
          };
        } finally {
          bitmap.close();
          if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
          }
        }
      }

      async function ensureHuman() {
        if (human) return human;
        if (!window.Human?.Human) {
          throw new Error("顔認識ライブラリを読み込めませんでした。ネット接続を確認してください。");
        }

        await requireWebGPU();
        const instance = new window.Human.Human({
          backend: "webgpu",
          modelBasePath: MODEL_BASE_PATH,
          async: true,
          warmup: "none",
          debug: false,
          deallocate: true,
          softwareKernels: false,
          face: {
            enabled: true,
            detector: {
              return: true,
              rotation: true,
              maxDetected: 50,
              iouThreshold: 0.01,
              minConfidence: 0.2,
            },
            mesh: { enabled: true },
            iris: { enabled: false },
            emotion: { enabled: false },
            description: { enabled: true },
          },
          body: { enabled: false },
          hand: { enabled: false },
          gesture: { enabled: false },
          object: { enabled: false },
          segmentation: { enabled: false },
        });

        status.textContent = "顔認識モデルを読み込んでいます。初回はネット接続が必要です。";
        try {
          await instance.load();
          if (instance.tf?.getBackend?.() !== "webgpu") {
            throw new Error("WebGPUで顔認識モデルを実行できませんでした。");
          }
          human = instance;
          return human;
        } catch (error) {
          instance.tf?.disposeVariables?.();
          throw error;
        }
      }

      async function runExclusive(fn) {
        if (busy) return;
        busy = true;
        updateControls();
        try {
          await fn();
        } catch (error) {
          console.error(error);
          status.textContent = `エラー: ${error instanceof Error ? error.message : String(error)}`;
        } finally {
          busy = false;
          updateControls();
        }
      }

      function renderPhotoList() {
        photoCount.textContent = String(photos.length);
        updateControls();
      }

      function clearResults() {
        groupsElement.replaceChildren();
        unmatchedList.replaceChildren();
        unmatchedContainer.hidden = true;
      }

      async function analyzePhoto(photo, model) {
        const bitmap = await createImageBitmap(photo.blob);
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        const context = canvas.getContext("2d");
        if (!context) {
          bitmap.close();
          throw new Error("写真を認識するCanvasを作成できません。");
        }
        context.drawImage(bitmap, 0, 0);
        bitmap.close();

        try {
          const result = await model.detect(canvas);
          const detectedFaces = [];
          for (const face of result.face ?? []) {
            try {
              if (face.embedding?.length) {
                detectedFaces.push({
                  photo,
                  embedding: Array.from(face.embedding),
                  box: Array.isArray(face.box) ? [...face.box] : null,
                  score: face.boxScore ?? face.score ?? 0,
                });
              }
            } finally {
              face.tensor?.dispose?.();
            }
          }
          photo.faces = detectedFaces;
          photo.error = null;
        } finally {
          canvas.width = 0;
          canvas.height = 0;
        }
      }

      function averageEmbedding(faces) {
        const size = faces[0].embedding.length;
        const average = new Array(size).fill(0);
        for (const face of faces) {
          if (face.embedding.length !== size) {
            throw new Error("顔特徴量の長さが一致しません。");
          }
          for (let i = 0; i < size; i++) average[i] += face.embedding[i];
        }
        for (let i = 0; i < size; i++) average[i] /= faces.length;
        return average;
      }

      function clusterFaces(faces, threshold, model) {
        const groups = [];
        for (const face of faces) {
          let bestGroup = null;
          let bestSimilarity = -Infinity;
          for (const group of groups) {
            const similarity = model.match.similarity(face.embedding, group.centroid);
            if (similarity > bestSimilarity) {
              bestSimilarity = similarity;
              bestGroup = group;
            }
          }

          if (bestGroup && bestSimilarity >= threshold) {
            bestGroup.faces.push(face);
            bestGroup.centroid = averageEmbedding(bestGroup.faces);
          } else {
            groups.push({ faces: [face], centroid: face.embedding.slice() });
          }
        }

        return groups.sort((a, b) => {
          const aPhotos = new Set(a.faces.map((face) => face.photo.id)).size;
          const bPhotos = new Set(b.faces.map((face) => face.photo.id)).size;
          return bPhotos - aPhotos;
        });
      }

      function makePreview(photo) {
        const image = document.createElement("img");
        image.src = photo.previewUrl;
        image.alt = photo.name;
        image.loading = "lazy";
        image.style.maxWidth = `${MAX_PREVIEW_SIDE}px`;
        image.style.height = "auto";
        return image;
      }

      function renderGroups(groups, allPhotos) {
        clearResults();
        groups.forEach((group, index) => {
          const section = document.createElement("section");
          const heading = document.createElement("h3");
          const groupedPhotos = new Map();
          for (const face of group.faces) {
            if (!groupedPhotos.has(face.photo.id)) groupedPhotos.set(face.photo.id, face.photo);
          }
          heading.textContent = `人物 ${index + 1}（${groupedPhotos.size}枚の写真）`;
          section.append(heading);

          const list = document.createElement("ul");
          for (const photo of groupedPhotos.values()) {
            const item = document.createElement("li");
            const figure = document.createElement("figure");
            figure.append(makePreview(photo));
            const caption = document.createElement("figcaption");
            caption.textContent = photo.name;
            figure.append(caption);
            item.append(figure);
            list.append(item);
          }
          section.append(list);
          groupsElement.append(section);
        });

        const unmatched = allPhotos.filter((photo) => photo.faces?.length === 0 || photo.error);
        if (unmatched.length) {
          unmatchedContainer.hidden = false;
          for (const photo of unmatched) {
            const item = document.createElement("li");
            item.textContent = photo.error
              ? `${photo.name}: 認識に失敗しました (${photo.error})`
              : `${photo.name}: 顔を検出できませんでした。`;
            unmatchedList.append(item);
          }
        }
      }

      fileInput.addEventListener("change", () => {
        const files = Array.from(fileInput.files ?? []);
        fileInput.value = "";
        if (files.length === 0) return;

        runExclusive(async () => {
          stopCamera();
          clearResults();
          let added = 0;
          const errors = [];
          for (let i = 0; i < files.length; i++) {
            status.textContent = `写真を準備しています: ${i + 1}/${files.length}`;
            try {
              photos.push(await createPhoto(files[i]));
              added++;
            } catch (error) {
              console.error(error);
              errors.push(`${files[i].name}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          renderPhotoList();
          status.textContent = errors.length
            ? `${added}枚を追加しました。読み込めなかった写真: ${errors.join("、")}`
            : `${added}枚の写真を追加しました。`;
        });
      });

      cameraStartButton.addEventListener("click", () => runExclusive(async () => {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("カメラを利用できません。HTTPSまたはlocalhostでページを開いてください。");
        }
        status.textContent = "カメラへのアクセスを待っています…";
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.hidden = false;
        try {
          await cameraVideo.play();
          status.textContent = "撮影する位置を合わせて「撮影して追加」を押してください。";
        } catch (error) {
          stopCamera();
          throw error;
        }
      }));

      cameraCaptureButton.addEventListener("click", () => runExclusive(async () => {
        if (!cameraStream) throw new Error("先にカメラを起動してください。");
        if (cameraVideo.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !cameraVideo.videoWidth) {
          throw new Error("カメラ映像を準備しています。少し待ってから撮影してください。");
        }

        const scale = Math.min(
          1,
          MAX_IMAGE_SIDE / Math.max(cameraVideo.videoWidth, cameraVideo.videoHeight),
        );
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(cameraVideo.videoWidth * scale));
        canvas.height = Math.max(1, Math.round(cameraVideo.videoHeight * scale));
        const context = canvas.getContext("2d");
        if (!context) throw new Error("撮影画像用のCanvasを作成できません。");
        context.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);

        try {
          const blob = await canvasToBlob(canvas);
          const previewUrl = URL.createObjectURL(blob);
          objectUrls.add(previewUrl);
          const photo = {
            id: nextPhotoId++,
            name: `撮影 ${photos.length + 1}`,
            blob,
            previewUrl,
            faces: null,
            error: null,
          };
          photos.push(photo);
          clearResults();
          renderPhotoList();
          status.textContent = "写真を追加しました。人物ごとに仕分けできます。";
        } finally {
          canvas.width = 0;
          canvas.height = 0;
          stopCamera();
        }
      }));

      cameraStopButton.addEventListener("click", () => {
        stopCamera();
        status.textContent = "カメラを停止しました。";
      });

      sortButton.addEventListener("click", () => runExclusive(async () => {
        if (photos.length === 0) throw new Error("先に写真を追加してください。");
        const threshold = Number(thresholdInput.value);
        if (!Number.isFinite(threshold) || threshold < 0 || threshold > 1) {
          throw new Error("類似度は0から1の範囲で指定してください。");
        }

        stopCamera();
        clearResults();
        const model = await ensureHuman();
        let failed = 0;
        for (let i = 0; i < photos.length; i++) {
          const photo = photos[i];
          if (photo.faces !== null || photo.error) continue;
          status.textContent = `顔を探しています: ${i + 1}/${photos.length} — ${photo.name}`;
          try {
            await analyzePhoto(photo, model);
          } catch (error) {
            photo.error = error instanceof Error ? error.message : String(error);
            photo.faces = [];
            failed++;
            console.error(error);
          }
        }

        const faces = photos.flatMap((photo) => photo.faces ?? []);
        const groups = clusterFaces(faces, threshold, model);
        renderGroups(groups, photos);
        const faceCount = faces.length;
        status.textContent = `${photos.length}枚の写真から顔を${faceCount}件検出し、${groups.length}グループにまとめました。${failed ? ` 認識に失敗した写真: ${failed}枚。` : ""}`;
      }));

      clearButton.addEventListener("click", () => {
        if (busy) return;
        stopCamera();
        for (const url of objectUrls) URL.revokeObjectURL(url);
        objectUrls.clear();
        photos.length = 0;
        clearResults();
        renderPhotoList();
        status.textContent = "写真を送ってください。";
      });

      window.addEventListener("pagehide", () => {
        stopCamera();
        for (const url of objectUrls) URL.revokeObjectURL(url);
        human?.tf?.disposeVariables?.();
      });
    </script>
  </body>
</html>
